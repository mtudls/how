# how — project tasks.
#
#   mise tasks                   list everything below
#   mise run test                run the unit tests
#   mise run lint                ruff, flake8, shellcheck, version/manifest check (whatever is installed)
#   mise run install             install ./how from this checkout to ~/.local/bin (install.sh --local)
#   mise run release 1.0.1       bump the version everywhere, test, commit and tag LOCALLY.
#                                It never pushes: it prints the push command for you to run.

[tasks.test]
description = "Run all tests"
run = "python3 -m unittest discover -s tests"

[tasks.lint]
description = "Lint Python and shell (skips tools that are not installed), check versions and manifest.json"
run = '''
set -euo pipefail
python3 -m py_compile how scripts/check_release.py
bash -n install.sh scripts/plugin-link.sh
if command -v ruff >/dev/null; then ruff check how scripts/ tests/; else echo "- ruff not installed, skipped"; fi
if command -v flake8 >/dev/null; then flake8 --max-line-length=120 --extend-ignore=E501 how scripts/ tests/; else echo "- flake8 not installed, skipped"; fi
if command -v shellcheck >/dev/null; then shellcheck install.sh scripts/plugin-link.sh; else echo "- shellcheck not installed, skipped"; fi
python3 scripts/check_release.py
'''

[tasks.install]
description = "Install how from this checkout to ~/.local/bin"
run = "./install.sh --local"

[tasks.release]
description = "Prepare a release locally: mise run release 1.0.1 (bump, test, commit, tag; never pushes)"
usage = 'arg "<version>" help="e.g. 1.0.1"'
run = '''
set -euo pipefail
v="${usage_version#v}"
git diff --quiet HEAD || { echo "✗ commit or stash your changes first"; exit 1; }
if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "✗ tag v$v already exists"; exit 1; fi

# 1. One version, five places: how, PKGBUILD, .SRCINFO, manifest.json, install.sh.
python3 scripts/check_release.py --bump "$v"

# 2. Never ship red.
python3 -m unittest discover -s tests
python3 scripts/check_release.py "v$v"

# 3. Commit and tag locally.
git commit -am "chore(release): v$v"
git tag -a "v$v" -m "how v$v"

branch="$(git rev-parse --abbrev-ref HEAD)"
echo
echo "✓ v$v is committed and tagged locally. Nothing was pushed."
echo "  Review it (git show v$v), then publish with:"
echo "    git push origin $branch v$v"
echo "  The tag runs .github/workflows/release.yml (GitHub release, SHA256SUMS, AUR if configured)."
'''
