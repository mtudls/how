name: Bug report
description: A wrong or unsafe suggestion, a wrong safety badge, or a CLI/installation problem.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve `how`. Please do not paste your API key or anything private.
  - type: input
    id: question
    attributes:
      label: What you asked
      placeholder: how to find the largest files here
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What how suggested (command and badge)
      description: Copy the command and its badge (safe / changes / dangerous).
      render: text
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The command you would have used, or why the badge is wrong.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `how doctor`
      description: Shows version, install method (package / plugin / script) and OS. It never prints your key.
      render: text
    validations:
      required: true
