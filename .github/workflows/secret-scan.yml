name: Secret Audit
run-name: "Secrets: ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches: [main, argon]
  pull_request:
    branches: [main, argon]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded API keys in tracked files
        run: |
          if grep -rnE "gsk_[a-zA-Z0-9]{25,}|sk-[a-zA-Z0-9]{25,}|ghp_[a-zA-Z0-9]{25,}" how install.sh README.md scripts/ .github/ docs/; then
            echo "ERROR: Potential hardcoded API key detected!"
            exit 1
          fi

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
