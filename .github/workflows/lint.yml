name: Code Quality
run-name: "Quality: ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax compile check
        run: |
          python -m py_compile how tests/test_vv_suite.py scripts/ai_architect_review.py
          bash -n install.sh

      - name: Install Ruff & Flake8
        run: |
          pip install ruff flake8

      - name: Lint checks
        run: |
          ruff check how
          flake8 how --max-line-length=120 --extend-ignore=E501,E402,E722,F401,F841,E302,E305
