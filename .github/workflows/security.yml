name: Security Audit
run-name: "Security: ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches: [main, argon]
  pull_request:
    branches: [main, argon]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security check (Bandit SAST & Sandbox Invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Static security scan & Safety Suite
        run: |
          bandit -r how scripts/transpile_rust.py scripts/ai_architect_review.py -ll --skip B310,B404,B603,B607
          python3 tests/test_safety.py -v
