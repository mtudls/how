name: Security Scan
run-name: "Security Scan: ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit Security Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit
        run: |
          # B310: audit urlopen for permitted schemes (Groq API endpoints are hardcoded https://)
          # B603, B607: subprocess calls (xdg-open, gh, hyprctl)
          bandit -r how -ll --skip B310,B603,B607
