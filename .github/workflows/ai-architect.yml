name: AI Architect Review & Closed-Loop ASI
run-name: "AI Architect Review: ${{ github.event.head_commit.message || github.ref_name }}"

on:
  schedule:
    # Runs weekly on Sunday at 03:00 UTC (keeps token usage well below limits)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      closed_loop:
        description: 'Enable Closed-Loop ASI (Code -> Gate -> PR)'
        required: false
        default: 'true'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-architect-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Autonomous Codebase Analysis & Verification Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 4 Hard Verification Gates (Rust, V&V, Safety, A/B Latency)
        run: |
          python scripts/ai_architect_review.py --verify-gates

      - name: Run Autonomous AI Maintainer Review (Code -> Gate -> PR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ASI_CLOSED_LOOP: ${{ github.event.inputs.closed_loop || '1' }}
        run: |
          python scripts/ai_architect_review.py --closed-loop
